version: "3.8"
services:
  app:
    build: .
    privileged: true
    ports:
      - "3000:3000"
    environment:
      DB_PASSWORD: supersecret123
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    depends_on:
      - db
  db:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=hunter2hunter2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
  cache:
    image: redis:latest
    network_mode: host
